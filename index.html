<title>Hakan Tunç İnşaat Şantiye Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: tek sütun, alt sekme çubuğu, büyük dokunma hedefleri; sayılar kondanse şantiye tabelası yazısıyla */
:root{
  --bg:#EDEFEB; --surface:#FFFFFF; --surface2:#F4F5F1; --ink:#16201C; --muted:#5B6860; --line:#D8DCD4;
  --accent:#C93F0B; --accent-ink:#FFFFFF; --pos:#17703F; --neg:#B42318; --hero:#16201C; --hero-ink:#F3F5EF; --hero-muted:#A9B5AC;
  --display:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1411; --surface:#18201B; --surface2:#202B24; --ink:#EAF0EB; --muted:#9AA79F; --line:#2D3A32;
    --accent:#FF7B3F; --accent-ink:#1B0F08; --pos:#4CC38A; --neg:#FF8F80; --hero:#202B24; --hero-ink:#F3F5EF; --hero-muted:#9AA79F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1411; --surface:#18201B; --surface2:#202B24; --ink:#EAF0EB; --muted:#9AA79F; --line:#2D3A32;
  --accent:#FF7B3F; --accent-ink:#1B0F08; --pos:#4CC38A; --neg:#FF8F80; --hero:#202B24; --hero-ink:#F3F5EF; --hero-muted:#9AA79F;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:auto}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.4;
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.big,dd,.amt,.tile b{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto}
#top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:16px 0 12px}
#top h1{margin:0;font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;letter-spacing:.01em;text-transform:uppercase}
#top .date{color:var(--muted);font-size:13px;margin-top:2px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand>svg{width:44px;height:44px;flex:none;border-radius:10px}
.brand>div{min-width:0}
.brand small{display:block;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:1px}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;padding-bottom:4px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--pos);display:inline-block}
.status.wait i{background:var(--accent)}
.status.off i{background:var(--neg)}
h2{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:var(--r);padding:18px 18px 16px}
.hero .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--hero-muted)}
.big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.05;margin:4px 0 6px}
.hero .sub{font-size:13px;color:var(--hero-muted)}
.neg{color:var(--neg)} .pos{color:var(--pos)}
.hero .big.neg{color:#FF9A8B}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.tile span{display:block;font-size:12px;color:var(--muted)}
.tile b{display:block;font-family:var(--display);font-weight:700;font-size:24px;line-height:1.15;margin-top:2px;overflow-wrap:anywhere}
.tile small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;text-align:left;min-height:64px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.act b{font-weight:600}
.act span{font-size:12px;color:var(--muted)}
.act.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.act.primary span{color:inherit;opacity:.85}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.pcard h3{margin:0 0 8px;font-size:16px;font-weight:600}
dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
dt{color:var(--muted);font-size:13px}
dd{margin:0;text-align:right;font-weight:500}
dl .tot{font-weight:700;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
dl dt.tot{color:var(--ink)}
.hint{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.hint b{display:block;margin-bottom:4px}
.hint p{margin:0;color:var(--muted);font-size:14px}
.banner{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:12px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;min-width:0}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-family:var(--display);font-weight:700;font-size:18px;white-space:nowrap;text-align:right}
.amt small{display:block;font-family:var(--body);font-weight:400;font-size:11.5px;color:var(--muted)}
.tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:3px 7px;border-radius:6px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.out{color:var(--neg)} .tag.in{color:var(--pos)} .tag.prop{color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin:0 -2px;-webkit-overflow-scrolling:touch}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;min-height:40px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.btn{min-height:48px;padding:0 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--neg)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.bar .grow{flex:1}
/* puantaj */
.datebar{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:stretch;margin-bottom:10px}
.datebar .btn{padding:0;font-size:20px}
.datebar label{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;min-height:52px}
.datebar label span{font-size:12px;color:var(--muted);text-transform:capitalize}
.datebar input{border:0;background:none;text-align:center;font-weight:600;font-size:16px;width:100%;min-width:0}
.summary{display:flex;gap:16px;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin:10px 0}
.summary div{min-width:0}
.summary span{display:block;font-size:12px;color:var(--muted)}
.summary b{font-family:var(--display);font-size:20px;font-weight:700}
.w{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.w .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.w .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w .rt{font-size:12.5px;color:var(--muted);white-space:nowrap}
.ctl{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:10px;align-items:center}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{min-height:46px;font-weight:600;background:var(--surface2);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ink);color:var(--bg)}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{width:42px;min-height:46px;font-size:20px;background:var(--surface2)}
.step span{min-width:62px;text-align:center;font-size:13px;line-height:1.15}
.step b{display:block;font-size:16px}
.w .line{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:8px}
.site{width:100%;min-height:44px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 12px}
.bill{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.bill .chip{min-height:40px;padding:0 12px;font-size:13.5px}
.bill label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.brate{width:96px;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px;font-size:16px}
/* ayarlar / form */
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.fld input,.fld select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;font-size:16px}
.fld small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.info{display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border-radius:10px;padding:12px;margin-bottom:12px}
.info b{font-family:var(--display);font-size:20px}
.err{color:var(--neg);font-size:14px;min-height:20px;margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
/* nav, fab, sheet */
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));z-index:20}
#nav .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);min-height:52px;justify-content:center;border-radius:10px}
#nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--accent);font-weight:600}
#fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.28);z-index:15}
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
#sheet .scrim{position:absolute;inset:0;background:rgba(10,14,12,.55)}
#sheet .panel{position:relative;width:100%;max-width:560px;max-height:92%;display:flex;flex-direction:column;background:var(--bg);
  border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}
.panel-head h3{margin:0;font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.panel-head button{width:44px;height:44px;font-size:22px;color:var(--muted)}
.panel-body{overflow-y:auto;padding:4px 16px 12px;flex:1;-webkit-overflow-scrolling:touch}
.panel-foot{display:flex;gap:10px;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.panel-foot .btn{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.bad{background:var(--neg);color:#fff}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){
  #sheet .panel{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.lbox{width:100%;max-width:360px;text-align:center}
.lbox svg{width:72px;height:72px;border-radius:16px}
.lbox h1{font-family:var(--display);text-transform:uppercase;font-size:28px;margin:14px 0 0;letter-spacing:.01em}
.lbox p{color:var(--muted);margin:2px 0 20px}
.lbox .fld{text-align:left}
.lbox .err{text-align:left}
</style>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var nf=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:2});
var money=function(n){var v=Math.round((+n||0)*100)/100;if(Object.is(v,-0))v=0;return nf.format(v)+' ₺'};
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var today=function(){return iso(new Date())};
var parseISO=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var addDays=function(s,n){var d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)};
var trDate=function(s){if(!s)return '';var p=s.split('-');return p[2]+'.'+p[1]+'.'+p[0]};
var weekday=function(s){return new Intl.DateTimeFormat('tr-TR',{weekday:'long'}).format(parseISO(s))};
function num(s){
  s=String(s==null?'':s).trim().replace(/\s|₺/g,'');
  if(!s)return NaN;
  if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  var n=Number(s);return isFinite(n)?n:NaN;
}
var DEF={p1:'Ortak 1',p2:'Ortak 2',share1:50,dayHours:9,otMult:1.5,contract:0};
var CATS=['Malzeme','Yakıt','Yemek','Ulaşım','Kira','Alet / Ekipman','Elektrik / Su','Ofis','Vergi / SGK','Diğer'];
var COLL={mjobs:'muteahhitisleri',workers:'calisanlar',teams:'ekipler',timesheet:'puantaj',jobs:'isler',payments:'odemeler',expenses:'giderler',income:'gelirler',partners:'ortaklar'};
var S={settings:Object.assign({},DEF),mjobs:[],workers:[],teams:[],timesheet:[],jobs:[],payments:[],expenses:[],income:[],partners:[]};
var loaded={},settingsLoaded=false,dbErr=null,readOnly=false,slow=false;
var db=null,userApi=null;
var view='home',date=today(),feedFilter='all',feedLimit=60,peopleTab='workers';
var chains=new Map();

/* ---------- veri yazma ---------- */
function toast(msg,bad){var t=$('#toast');t.textContent=msg;t.className=bad?'bad':'';t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2600)}
function errMsg(e){var c=e&&e.code;
  if(c==='quota_exceeded')return 'Kayıt sınırı doldu.';
  if(c==='invalid_argument')return 'Kaydedilemedi. Düzenleme yetkiniz olmayabilir.';
  if(c==='resource_exhausted')return 'Çok hızlı işlem yapıldı, biraz bekleyin.';
  return 'Kaydedilemedi. Bağlantıyı kontrol edin.';}
function fail(e){toast(errMsg(e),true)}
function canWrite(){
  if(!db){toast('Veritabanına bağlanılamadı.',true);return false}
  if(readOnly){toast('Bu görünümde kayıt yapamazsınız.',true);return false}
  return true;
}
function enqueue(path,fn){return Promise.resolve().then(fn)}
function dput(coll,id,data){return enqueue(coll+'/'+id,function(){return db.doc(coll+'/'+id).set(data)}).catch(fail)}
function ddel(coll,id){return enqueue(coll+'/'+id,function(){return db.doc(coll+'/'+id).delete()}).catch(fail)}
function newId(coll){return db.collection(coll).doc().id}

/* ---------- hesaplar ---------- */
function compute(){
  var st=S.settings,hrs=+st.dayHours||9,mult=+st.otMult||1.5;
  var W={},T={},k;
  S.workers.forEach(function(w){W[w.id]={w:w,days:0,ot:0,earn:0,paid:0}});
  S.teams.forEach(function(t){T[t.id]={t:t,earn:0,paid:0}});
  var wageTotal=0,teamTotal=0,billed=0;
  S.timesheet.forEach(function(d){
    var en=d.entries||{};
    Object.keys(en).forEach(function(wid){
      var e=en[wid],r=+e.r||0,dd=+e.d||0,oo=+e.o||0;
      var amt=dd*r+oo*r/hrs*mult;
      if(!W[wid])W[wid]={w:{id:wid,name:e.n||'(silinmiş)'},days:0,ot:0,earn:0,paid:0};
      W[wid].days+=dd;W[wid].ot+=oo;W[wid].earn+=amt;wageTotal+=amt;
      if(e.b){var br=+e.br>0?+e.br:r;billed+=dd*br+oo*br/hrs*mult}
    });
  });
  S.jobs.forEach(function(j){
    var amt=(+j.qty||0)*(+j.price||0);teamTotal+=amt;
    if(!T[j.team])T[j.team]={t:{id:j.team,name:j.teamName||'(silinmiş)'},earn:0,paid:0};
    T[j.team].earn+=amt;
  });
  var mjTotal=0,mjM2=0,mjMt=0;
  S.mjobs.forEach(function(j){mjTotal+=(+j.total||0);mjM2+=(+j.m2||0);mjMt+=(+j.mt||0)});
  var payW=0,payT=0,payKasa=0;
  var pocket={p1:0,p2:0};
  S.payments.forEach(function(p){
    var a=+p.amount||0;
    if(p.kind==='team'){payT+=a;if(!T[p.ref])T[p.ref]={t:{id:p.ref,name:p.name||'(silinmiş)'},earn:0,paid:0};T[p.ref].paid+=a}
    else{payW+=a;if(!W[p.ref])W[p.ref]={w:{id:p.ref,name:p.name||'(silinmiş)'},days:0,ot:0,earn:0,paid:0};W[p.ref].paid+=a}
    if(p.payer==='kasa'||!p.payer)payKasa+=a;else if(pocket[p.payer]!=null)pocket[p.payer]+=a;
  });
  var exp=0,expKasa=0;
  S.expenses.forEach(function(g){
    var a=+g.amount||0;exp+=a;
    if(g.payer==='kasa'||!g.payer)expKasa+=a;else if(pocket[g.payer]!=null)pocket[g.payer]+=a;
  });
  var cashIn=0,prop=0;
  var yevRecv=0;
  S.income.forEach(function(g){var a=+g.amount||0;if(g.type==='property')prop+=a;else{cashIn+=a;if(g.type==='yev')yevRecv+=a}});
  var put={p1:0,p2:0},take={p1:0,p2:0};
  S.partners.forEach(function(p){var a=+p.amount||0;var o=p.partner==='p2'?'p2':'p1';if(p.op==='take')take[o]+=a;else put[o]+=a});
  var putT=put.p1+put.p2,takeT=take.p1+take.p2;
  var cashPlain=cashIn-yevRecv;
  var cost=wageTotal+teamTotal+exp,incT=cashPlain+prop+billed,net=incT-cost;
  var s1=Math.min(100,Math.max(0,+st.share1||0))/100;
  var P={};
  ['p1','p2'].forEach(function(o){
    P[o]={put:put[o],pocket:pocket[o],take:take[o],cari:put[o]+pocket[o]-take[o],share:net*(o==='p1'?s1:1-s1),pct:Math.round((o==='p1'?s1:1-s1)*100)};
  });
  return {mjTotal:mjTotal,mjM2:mjM2,mjMt:mjMt,W:W,T:T,wageTotal:wageTotal,teamTotal:teamTotal,exp:exp,cost:cost,cashIn:cashIn,prop:prop,incT:incT,net:net,billed:billed,yevRecv:yevRecv,cashPlain:cashPlain,
    put:putT,take:takeT,cashBal:cashIn+putT-takeT-payKasa-expKasa,
    debtW:wageTotal-payW,debtT:teamTotal-payT,P:P};
}

var pendingRender=false,rafId=0;
function sched(){if(rafId)return;rafId=requestAnimationFrame(function(){rafId=0;render()})}
function typing(){var a=document.activeElement;return a&&$('#view').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!a.matches('#pdate')}
function allLoaded(){return Object.keys(COLL).every(function(k){return loaded[k]})&&settingsLoaded}
function render(){
  var st=$('#top');
  var cls='status',txt='Canlı';
  if(!db&&dbErr){cls+=' off';txt='Bağlantı yok'}
  else if(!navigator.onLine){cls+=' wait';txt='Çevrimdışı'}
  else if(readOnly){cls+=' off';txt='Salt okunur'}
  else if(!allLoaded()){cls+=' wait';txt=slow?'Bağlanamadı, bekleniyor':'Bağlanıyor'}
  st.innerHTML='<div class="brand">'+LOGO+'<div><small>Hakan Tunç İnşaat</small><h1>'+TITLES[view]+'</h1><div class="date">'+weekday(today()).replace(/^./,function(c){return c.toLocaleUpperCase('tr')})+', '+trDate(today())+'</div></div></div><div class="'+cls+'"><i></i>'+txt+'</div>';
  var nav=$('#nav .in');
  nav.innerHTML=NAV.map(function(n){return '<button class="'+(view===n[0]?'on':'')+'" data-act="goto" data-v="'+n[0]+'" aria-label="'+n[1]+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[n[0]]+'</svg>'+n[1]+'</button>'}).join('');
  $('#fab').hidden=!(view==='hareket');
  if(typing()){pendingRender=true;return}
  pendingRender=false;
  var h='';
  if(dbErr==='nodb')h+='<div class="banner">Firebase ayarı eksik. firebase-config.js dosyasını doldurun.</div>';
  else if(slow&&!allLoaded())h+='<div class="banner">Veriler henüz alınamadı. Bağlantı gelince otomatik yüklenecek.</div>';
  if(readOnly)h+='<div class="banner">Bu hesapla yalnızca görüntüleyebilirsiniz. Kayıt girmek için düzenleme yetkisi gerekir.</div>';
  h+=view==='home'?viewHome():view==='puantaj'?viewPuantaj():view==='hareket'?viewHareket():view==='kisiler'?viewKisiler():viewAyar();
  $('#view').innerHTML=h;
}
document.addEventListener('focusout',function(){setTimeout(function(){if(pendingRender&&!typing())sched()},50)});

/* ---------- alt panel ve form motoru ---------- */
function openSheet(title,body,foot){$('#sh-title').textContent=title;$('#sh-body').innerHTML=body;$('#sh-foot').innerHTML=foot||'';$('#sheet').hidden=false}
function closeSheet(){$('#sheet').hidden=true;$('#sh-body').innerHTML='';$('#sh-foot').innerHTML=''}
var form=null;
function fieldHTML(f,v){
  var val=v[f.k]==null?'':v[f.k];
  if(f.type==='info')return '<div class="info"><span>'+esc(f.label)+'</span><b data-info="'+f.k+'">'+esc(f.fn(v))+'</b></div>';
  var id='f_'+f.k,h='<label class="fld" for="'+id+'"><span>'+esc(f.label)+'</span>';
  if(f.type==='select'){
    h+='<select id="'+id+'"'+(f.reload?' data-reload="1"':'')+'>'+(f.blank?'<option value="">Seçin</option>':'')+f.opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(o[0])===String(val)?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>';
  }else if(f.type==='date'){h+='<input id="'+id+'" type="date" value="'+esc(val)+'">'}
  else if(f.type==='money'||f.type==='number'){h+='<input id="'+id+'" type="text" inputmode="decimal" autocomplete="off" value="'+esc(val)+'">'}
  else{h+='<input id="'+id+'" type="'+(f.type||'text')+'" autocomplete="off" value="'+esc(val)+'" maxlength="120">'}
  if(f.hint)h+='<small>'+esc(f.hint)+'</small>';
  return h+'</label>';
}
function readVals(fs,v){fs.forEach(function(f){if(f.type==='info')return;var el=document.getElementById('f_'+f.k);if(el)v[f.k]=el.value});return v}
function openForm(cfg){
  var vals=Object.assign({},cfg.values),delArmed=false;
  form={cfg:cfg,vals:vals};
  function draw(){
    var fs=cfg.fields(vals);form.fs=fs;
    $('#sh-body').innerHTML=fs.map(function(f){return fieldHTML(f,vals)}).join('')+'<p class="err" id="f_err"></p>';
  }
  $('#sh-title').textContent=cfg.title;
  draw();
  $('#sh-foot').innerHTML=(cfg.del?'<button class="btn danger" id="f_del" style="flex:0 0 auto">Sil</button>':'')+'<button class="btn primary" id="f_save">Kaydet</button>';
  $('#sheet').hidden=false;
  var body=$('#sh-body');
  body.oninput=function(){readVals(form.fs,vals);form.fs.forEach(function(f){if(f.type==='info'){var el=body.querySelector('[data-info="'+f.k+'"]');if(el)el.textContent=f.fn(vals)}})};

    if(!canWrite())return;

/* ---------- puantaj yazma ---------- */
function persistDay(day){
  var snap=JSON.parse(JSON.stringify({date:day.date,site:day.site||'',entries:day.entries||{}}));
  if(!Object.keys(snap.entries).length&&!snap.site)ddel('puantaj',day.id);else dput('puantaj',day.id,snap);
}
function dayRef(create){
  var day=S.timesheet.find(function(d){return d.id===date});
  if(!day&&create){day={id:date,date:date,site:'',entries:{}};S.timesheet.push(day)}
  return day;
}
function setEntry(wid,patch){
  if(!canWrite())return;
  var w=S.workers.find(function(x){return x.id===wid});
  var day=dayRef(true);if(!day.entries)day.entries={};
  var prev=day.entries[wid]||{d:0,o:0,r:w?+w.rate||0:0,n:w?w.name:''};
  var e=Object.assign({},prev,patch);if(w)e.n=w.name;
  if(!(e.d>0)&&!(e.o>0)&&!e.b)delete day.entries[wid];else day.entries[wid]=e;
  persistDay(day);sched();
}

/* ---------- olaylar ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),v=el.getAttribute('data-v'),id=el.getAttribute('data-id'),t=el.getAttribute('data-t');
  if(a==='goto'){view=v;if(v==='hareket')feedLimit=60;closeSheet();sched();window.scrollTo(0,0)}
  else if(a==='closesheet'){closeSheet()}
  else if(a==='fab'){
    openSheet('Yeni kayıt',
      '<div class="actions">'+
      '<button class="act" data-act="quick" data-t="odeme"><b>Avans / ödeme</b><span>Çalışan, ekip veya ortak</span></button>'+
      '<button class="act" data-act="quick" data-t="gider"><b>Gider</b><span>Günlük harcama</span></button>'+
      '<button class="act" data-act="quick" data-t="gelir"><b>Müteahhitten gelen</b><span>Nakit veya gayrimenkul</span></button>'+
      '<button class="act" data-act="quick" data-t="ortak"><b>Ortak parası</b><span>Sermaye / para çekme</span></button>'+
      '<button class="act" data-act="quick" data-t="is"><b>Ekip işi</b><span>Hakediş yaz</span></button>'+
      '<button class="act" data-act="quick" data-t="mj"><b>Müteahhit işi</b><span>m² / mt, birim fiyat</span></button>'+
      '<button class="act" data-act="goto" data-v="puantaj"><b>Puantaj</b><span>Günlük liste</span></button></div>','');
  }
  else if(a==='quick'){if(!canWrite())return;recForm(t)}
  else if(a==='rec'){recForm(t,id)}
  else if(a==='filter'){feedFilter=v;feedLimit=60;sched()}
  else if(a==='more'){feedLimit+=60;sched()}
  else if(a==='ptab'){peopleTab=v;sched()}
  else if(a==='addw'){if(!canWrite())return;recForm('worker')}
  else if(a==='addt'){if(!canWrite())return;recForm('team')}
  else if(a==='addmj'){if(!canWrite())return;recForm('mj')}
  else if(a==='person'){openPerson(el.getAttribute('data-k'),id)}
  else if(a==='editp'){recForm(el.getAttribute('data-k'),id)}
  else if(a==='payfor'){if(!canWrite())return;var k=el.getAttribute('data-k');recForm('odeme',null,{kind:k,ref:id,date:today()})}
  else if(a==='pd'){setEntry(el.getAttribute('data-w'),{d:Number(v)})}
  else if(a==='po'){
    var wid=el.getAttribute('data-w'),day=dayRef(false),cur=day&&day.entries&&day.entries[wid]?+day.entries[wid].o||0:0;
    setEntry(wid,{o:Math.max(0,cur+Number(v))});
  }
  else if(a==='pb'){
    var pw=el.getAttribute('data-w'),pdy=dayRef(false),pe=pdy&&pdy.entries?pdy.entries[pw]:null;
    setEntry(pw,{b:!(pe&&pe.b)});
  }
  else if(a==='dprev'){date=addDays(date,-1);sched()}
  else if(a==='dnext'){date=addDays(date,1);sched()}
  else if(a==='dtoday'){date=today();sched()}
  else if(a==='copyy'){
    if(!canWrite())return;
    var y=S.timesheet.find(function(d){return d.id===addDays(date,-1)});if(!y)return;
    var day2=dayRef(true);day2.entries=JSON.parse(JSON.stringify(y.entries||{}));if(!day2.site)day2.site=y.site||'';
    persistDay(day2);sched();toast('Dünkü liste kopyalandı');
  }
  else if(a==='savesettings'){
    var g=function(i){return document.getElementById(i).value};
    var sh=num(g('s_share')),hr=num(g('s_hours')),ot=num(g('s_ot')),ct=g('s_contract').trim()?num(g('s_contract')):0;
    var err=$('#s_err');
    if(isNaN(sh)||sh<0||sh>100){err.textContent='Kâr payı 0 ile 100 arasında olmalı.';return}
    if(isNaN(hr)||hr<=0||hr>24){err.textContent='Günlük saat 0 ile 24 arasında olmalı.';return}
    if(isNaN(ot)||ot<1){err.textContent='Mesai katsayısı en az 1 olmalı.';return}
    if(isNaN(ct)||ct<0){err.textContent='Sözleşme bedelini sayı olarak yazın.';return}
    if(!canWrite())return;
    var ns={p1:g('s_p1').trim()||DEF.p1,p2:g('s_p2').trim()||DEF.p2,share1:sh,dayHours:hr,otMult:ot,contract:ct};
    S.settings=ns;dput('ayarlar','main',ns);err.textContent='';toast('Ayarlar kaydedildi');sched();
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='pdate'&&t.value){date=t.value;sched()}
  else if(t.classList&&t.classList.contains('brate')){
    var bv=num(t.value);
    if(isNaN(bv)||bv<0){toast('Günlük ücreti sayı olarak yazın.',true);sched();return}
    setEntry(t.getAttribute('data-w'),{br:bv});
  }
  else if(t.id==='psite'){
    if(!canWrite())return;
    var site=t.value.trim(),day=dayRef(false);
    if(!day&&!site)return;
    day=dayRef(true);day.site=site;persistDay(day);
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

/* ---------- başlangıç ---------- */
function clone(o){return JSON.parse(JSON.stringify(o))}
async function init(){
  render();
  var cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||/YOUR_|BURAYA/i.test(cfg.apiKey)){dbErr='nodb';render();return}
  firebase.initializeApp(cfg);
  var auth=firebase.auth(),fs=firebase.firestore();
  try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
  db=fs;
  var started=false;
  var lg=$('#login'),pw=$('#l_pw'),er=$('#l_err'),go=$('#l_go');
  function tryLogin(){
    var v=pw.value;if(!v){er.textContent='Şifreyi yazın.';return}
    go.disabled=true;er.textContent='';
    auth.signInWithEmailAndPassword(cfg.email,v).catch(function(e){
      var c=e&&e.code;
      er.textContent=(c==='auth/network-request-failed')?'İnternet yok. İlk girişte internet gerekir.':'Şifre yanlış.';
    }).then(function(){go.disabled=false});
  }
  go.onclick=tryLogin;
  pw.onkeydown=function(e){if(e.key==='Enter')tryLogin()};
  window.addEventListener('online',sched);window.addEventListener('offline',sched);
  auth.onAuthStateChanged(function(u){
    if(!u){lg.hidden=false;return}
    lg.hidden=true;pw.value='';
    if(started)return;started=true;
    setTimeout(function(){if(!allLoaded()){slow=true;sched()}},10000);
    Object.keys(COLL).forEach(function(key){
      db.collection(COLL[key]).onSnapshot(function(snap){
        S[key]=snap.docs.map(function(d){return Object.assign({id:d.id},clone(d.data()||{}))});
        loaded[key]=true;sched();
      },function(e){dbErr=(e&&e.code)||'err';loaded[key]=true;sched()});
    });
    db.doc('ayarlar/main').onSnapshot(function(s){
      S.settings=Object.assign({},DEF,s.exists?clone(s.data()):{});
      settingsLoaded=true;sched();
    },function(){settingsLoaded=true;sched()});
  });
}
init();
})();
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
</script>
